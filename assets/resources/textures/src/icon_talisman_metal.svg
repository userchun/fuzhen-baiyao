  <rect x="20" y="20" width="88" height="152" rx="12" fill="none" stroke="#F5D76E" stroke-width="4"/>
  <!-- 顶部挂孔 -->
  <circle cx="64" cy="20" r="6" fill="#14101C" stroke="#F5D76E" stroke-width="3"/>
  <!-- 圆形五行底纹 -->
  <g fill="none" stroke="#F5D76E" stroke-width="2.5" opacity="0.55">
    <circle cx="64" cy="96" r="40"/>
    <circle cx="64" cy="96" r="32" stroke-dasharray="4 4"/>
    <circle cx="36" cy="44" r="6"/><circle cx="92" cy="44" r="6"/>
    <circle cx="36" cy="150" r="6"/><circle cx="92" cy="150" r="6"/>
  </g>
  <!-- 中央空白符面 -->
  <circle cx="64" cy="96" r="26" fill="#3A3150" stroke="#F5D76E" stroke-width="3"/>
  <!-- 底部流苏 -->
  <path d="M56 172 L56 186 M64 172 L64 188 M72 172 L72 186" stroke="#9B3D2E" stroke-width="3" stroke-linecap="round"/>
