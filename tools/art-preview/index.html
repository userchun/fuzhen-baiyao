<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>符镇百妖 试玩</title>
<script type="importmap">{ "imports": { "cc": "./game/cc.js" } }</script>
<style>
  :root { --bg: #15171c; --panel: #23262e; --text: #e8e2d4; --muted: #9a958a; --line: #3a3e48; --gold: #ffd66e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang SC", sans-serif;
         display: flex; gap: 16px; padding: 16px; height: 100vh; overflow: hidden; }
  #stage { position: relative; flex: 0 0 auto; height: 100%; aspect-ratio: 720 / 1560; max-width: calc(100vw - 300px); }
  canvas { width: 100%; height: 100%; display: block; background: #000; border-radius: 8px; touch-action: none; user-select: none; }
  #overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
             gap: 12px; background: rgba(8, 10, 16, .72); border-radius: 8px; padding: 16px; text-align: center; }
  #overlay h2 { margin: 0 0 4px; color: var(--gold); font-size: 20px; }
  .card { width: 86%; padding: 12px 14px; border: 1px solid #b8913d; border-radius: 8px; background: #2a2016; color: var(--text);
          font: inherit; text-align: left; cursor: pointer; }
  .card:hover { background: #3a2c1c; }
  .card b { display: block; color: var(--gold); font-size: 16px; }
  aside { flex: 1; min-width: 220px; max-width: 280px; background: var(--panel); border-radius: 8px; padding: 14px; overflow: auto; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  select, button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .muted { color: var(--muted); font-size: 12px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  #stats { font-size: 12px; white-space: pre-wrap; color: var(--muted); }
  #missing { color: #e8826a; font-size: 12px; white-space: pre-wrap; }
  @media (max-width: 700px) {
    body { flex-direction: column; height: auto; overflow: auto; padding: 0; }
    #stage { width: 100vw; height: auto; max-width: none; }
    aside { max-width: none; margin: 0 16px 16px; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="overlay"></div></div>
<aside>
  <h1>符镇百妖 · 网页试玩</h1>
  <div class="muted">战斗、刷怪、选卡用的是游戏里的真实代码（build.sh 编译），画面按游戏坐标绘制。</div>
  <hr>
  <label>画面
    <select id="view">
      <option value="home">首页</option>
      <option value="play">试玩第一关</option>
      <option value="layout">素材摆放（自动走怪）</option>
    </select>
  </label>
  <div class="row">
    <button id="start">开始 / 重开</button>
    <button id="pause">暂停</button>
    <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="0.5">0.5×</option></select>
  </div>
  <div class="row"><button id="reloadArt">刷新素材</button></div>
  <div class="muted">换了 assets/resources/textures 里的图，点「刷新素材」立刻生效，不用重开。</div>
  <hr>
  <label><input type="checkbox" id="showBg" checked>背景</label>
  <label><input type="checkbox" id="showWall" checked>城墙</label>
  <label><input type="checkbox" id="showPlayer" checked>主角</label>
  <label><input type="checkbox" id="showEnemies" checked>妖怪</label>
  <label><input type="checkbox" id="showFx" checked>符咒、特效、飘字</label>
  <label><input type="checkbox" id="showSeal" checked>胸口字印</label>
  <label><input type="checkbox" id="showGuides">辅助线（出怪范围、垛口线）</label>
  <hr>
  <div class="muted">操作：符咒全自动攻击；整屏左右拖动 = 移动；键盘 A / D 或 ← / → 也能移动，空格暂停。合体槽满后点右下角圆钮（或按 Q）放五行合体大招。</div>
  <hr>
  <div id="stats"></div>
  <div id="missing"></div>
</aside>
<script type="module" src="./app.js"></script>
</body>
</html>
