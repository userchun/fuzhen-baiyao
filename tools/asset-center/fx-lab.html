<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>特效调参台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101321;color:#eee4ce;font:14px system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}p.sub{color:#a3a8b9;margin:0 0 12px;font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tabs button{font:inherit;color:#edddb7;background:#272638;border:1px solid #4a4256;border-radius:5px;padding:6px 10px;cursor:pointer}
.tabs button.on{border-color:#dbb65c;background:#3a3020}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}.pair figure{margin:0}.pair figcaption{font-size:12px;color:#dbb65c;margin-bottom:4px}
canvas{display:block;max-width:100%;max-height:52vh;margin:auto;image-rendering:pixelated;border:1px solid #3a3550;background:#111321}
.ctl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 16px;margin:14px 0}
.ctl label{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:6px;font-size:12px;color:#c9c3b2}
.ctl output{text-align:right;color:#dbb65c;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row button,.row select{font:inherit;color:#edddb7;background:#272638;border:1px solid #786447;border-radius:5px;padding:6px 10px;cursor:pointer}
pre{background:#0b0d17;border:1px solid #2c2a3a;padding:8px;font-size:11px;white-space:pre-wrap;word-break:break-all;color:#a3a8b9;max-height:140px;overflow:auto}
footer{font-size:11px;color:#858b9f;margin-top:10px}
body.embed{padding:8px;background:#0d1422}body.embed h1,body.embed p.sub,body.embed .tabs,body.embed #figA,body.embed pre,body.embed footer,body.embed #copy,body.embed #reset{display:none}
body.embed .pair{grid-template-columns:1fr}body.embed .pair figcaption{display:none}body.embed canvas{max-height:230px}body.embed .lvs canvas{max-height:200px}body.embed .lvs{gap:3px}body.embed .lvs figcaption{font-size:10px}body.embed .ctl{grid-template-columns:1fr 1fr;gap:4px 12px;margin:8px 0}body.embed .ctl label{grid-template-columns:52px minmax(0,1fr) 30px;font-size:11px}body.embed .ctl input{min-width:0;width:100%}body.embed .row button,body.embed .row select{padding:4px 8px;font-size:11px}
#full{display:none;color:#dbb65c;font-size:12px}body.embed #full{display:inline}
.lvs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.lvs figure{margin:0}.lvs figcaption{font-size:12px;color:#dbb65c;text-align:center;margin-bottom:4px}.lvs canvas{max-height:none;width:100%}
body.levels .pair{display:none}#lvMode.on{border-color:#dbb65c;background:#3a3020}
@media(max-width:560px){.pair{grid-template-columns:1fr}}
</style><script>
// 直接用文件方式打开时，浏览器不允许加载特效脚本，自动跳到素材中心本地服务
if(location.protocol==='file:')location.replace('http://127.0.0.1:8770/tools/asset-center/'+location.pathname.split('/').pop()+location.search);
addEventListener('error',e=>{const m=document.createElement('p');m.style='color:#ff8a6a;font-size:13px';m.textContent='特效加载失败：'+(e.message||e.target?.src||'未知错误')+'。请确认素材中心服务已启动：python3 tools/asset-center/serve.py';document.body.prepend(m)},true);
addEventListener('unhandledrejection',e=>{const m=document.createElement('p');m.style='color:#ff8a6a;font-size:13px';m.textContent='特效加载失败：'+e.reason;document.body.prepend(m)});
</script>
</head><body>
<h1>特效调参台 · 参考 / 符镇版</h1>
<p class="sub">左边是参考的 PixelFX 原配方，右边是按游戏玩法重写的符镇版，用滑杆实时改。满意后点“复制参数”，再接入战斗。</p>
<div class="tabs" id="tabs"></div>
<div class="pair">
  <figure id="figA"><figcaption id="capA">参考：PixelFX 原配方</figcaption><canvas id="a"></canvas></figure>
  <figure><figcaption>符镇版（可调）</figcaption><canvas id="b"></canvas></figure>
</div>
<div class="lvs" id="lvs" hidden></div>
<div class="ctl" id="ctl"></div>
<div class="row"><select id="bg"><option value="dark">深色底</option><option value="scene">战场底</option><option value="none">透明</option></select>
<button id="lvMode">1–5 级同屏</button><button id="pause">暂停</button><button id="replay">重播</button><button id="reset">恢复推荐值</button><button id="copy">复制参数</button><a id="full" target="_blank" rel="noopener">完整调参台 ↗</a></div>
<pre id="out"></pre>
<footer>配方来自 <a style="color:#dbb65c" href="https://github.com/patch-gg/pixelfx">PixelFX</a>（MIT，见 docs/evidence/pixelfx/NOTICE.md）。这里只是浏览器预览，尚未接入 Cocos。</footer>
<script type="module">
import {createFrame,clearFrame,composite,createFx} from '../../docs/evidence/pixelfx/core/index.js';
const P='../../docs/evidence/pixelfx/fx/';
// 游戏效果 → 复用配方 + 推荐调参（推荐值是起点，未在游戏里验证）
const LIST=[
 // file：符镇自制配方（右边，可调）；ref：参考的 PixelFX 原配方（左边，只看）。按金木水火土 + 天雷排列
 {key:'gold',name:'金 · 金光符',file:'fuzhen/gold-pillar.js',ref:'projectiles/energy-disc.js',tune:{}},
 {key:'vine',name:'木 · 青藤符',file:'fuzhen/vine-zone.js',ref:'nature/root-snare.js',tune:{}},
 {key:'ice',name:'水 · 寒冰符',file:'fuzhen/ice-drop.js',ref:'ice/ice-lance.js',tune:{}},
 {key:'meteor',name:'火 · 烈焰符',file:'fuzhen/meteor.js',ref:'fire/fireball.js',tune:{}},
 {key:'stone',name:'土 · 镇山符',file:'fuzhen/stone-pillar.js',ref:'impacts/ground-slam.js',tune:{}},
 {key:'thunder',name:'雷 · 天雷符',file:'fuzhen/thunder.js',ref:'lightning/chain-lightning.js',tune:{}},
 {key:'soul',name:'怪 · 引魂灯笼光环',file:'fuzhen/soul-aura.js',ref:'fire/fireball.js',tune:{}},
 {key:'slam',name:'怪 · Boss 砸地',file:'impacts/ground-slam.js',ref:'impacts/ground-slam.js',tune:{palette:['#1a1410','#3a2a1e','#6a4a30','#9a7044','#c8a060','#f0dcae','#ffffff'],stone:'#4a3c30',reach:110}},
];
const $=s=>document.querySelector(s);
const ground=new Image();ground.src='../../assets/resources/textures/bg_level1_village.png';
let fxL=[],levels=false,cur,mod,refMod,tuned,fxA,fxB,paused=false,last=performance.now(),extra={scale:1,timeScale:1,light:1,hue:0};
const SAVE='fxlab-v4:'+location.pathname;
const saved=(()=>{try{return JSON.parse(localStorage.getItem(SAVE))||{}}catch{return{}}})();
function persist(){try{saved[cur.key]={tuned,extra};localStorage.setItem(SAVE,JSON.stringify(saved))}catch{}}
// 色相整体偏移：把调好的色板再转一转，方便试别的五行配色
function hueShift(hex,deg){if(!deg)return hex;let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;
 if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
 h=(h+deg+360)%360;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
 const [R,G,B]=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
 return '#'+[R,G,B].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('')}
function opts(){const o={...tuned,light:extra.light};for(const k in o)if(Array.isArray(o[k]))o[k]=o[k].map(c=>typeof c==='string'?hueShift(c,extra.hue):c);return o}
const mk=(m,o={})=>createFx(m,{...o,x:m.meta.origin?.[0]??0,y:m.meta.origin?.[1]??0});
function build(){for(const [id,m] of [['a',refMod],['b',mod]]){const [w,h]=m.meta.size,c=$('#'+id);c.width=Math.round(w*Math.max(1,extra.scale));c.height=Math.round(h*Math.max(1,extra.scale))}
 fxA=mk(refMod);fxB=mk(mod,opts());
 fxL=[1,2,3,4,5].map(l=>mk(mod,{...opts(),level:l}));
 if(!$('#lvs').childElementCount)for(let l=1;l<=5;l++)$('#lvs').insertAdjacentHTML('beforeend',`<figure><figcaption>${l} 级</figcaption><canvas id="lv${l}"></canvas></figure>`);
 const [w,h]=mod.meta.size;for(let l=1;l<=5;l++){const c=$('#lv'+l);c.width=w;c.height=h}
 $('#out').textContent=JSON.stringify({effect:cur.name,recipe:cur.file,scale:extra.scale,timeScale:extra.timeScale,hue:extra.hue,options:opts()},null,1)}
function slider(label,val,min,max,step,on){const l=document.createElement('label');l.innerHTML=`<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"><output>${val}</output>`;
 const i=l.querySelector('input'),o=l.querySelector('output');i.oninput=()=>{o.textContent=i.value;on(+i.value);persist();build()};$('#ctl').append(l)}
const NAMES={radius:'弹体大小',speed:'飞行速度',length:'长度',height:'闪光高度',aim:'角度',size:'大小',teeth:'齿数',reach:'冲击范围',level:'符咒等级',vines:'主藤数量',tendrils:'藤须数量',leaves:'叶片数量',tick:'伤害跳动',life:'持续时间',chain:'连锁目标',gap:'连锁间隔',bloom:'花色',gold:'金色',volley:'连砸根数',crystals:'冰晶数量',arcs:'电弧数量',arrows:'加速箭头',flash:'闪白强度',glow:'符纹颜色',fall:'下落用时',tail:'拖尾长度',blast:'爆炸半径',puffs:'火团数量',sparks:'火星/金屑',angle:'斜落角度',width:'宽度',shards:'碎冰数量',spikes:'冰刺数量',frost:'结霜半径',bounce:'弹射次数',charge:'蓄力时长',hold:'停留时长',motes:'光点数量',talisman:'显示符纸',wave:'冲击波半径',rocks:'飞石数量',shake:'震屏幅度',active:'光环时长',wisps:'鬼火数量',pulse:'流光数量',seed:'随机种子',health:'强度'};
function controls(){$('#ctl').innerHTML='';
 slider('显示缩放',extra.scale,0.5,3,0.25,v=>extra.scale=v);
 slider('播放速度',extra.timeScale,0.25,2,0.05,v=>extra.timeScale=v);
 slider('发光强度',extra.light,0,2,0.05,v=>extra.light=v);
 slider('色相偏移',extra.hue,-180,180,5,v=>extra.hue=v);
 for(const [k,v] of Object.entries(mod.meta.options??{}).sort((a,b)=>(b[0]==='level')-(a[0]==='level'))){if(typeof v!=='number'||k==='hitAge'||k==='hitX')continue;
  const lvl=k==='level',max=lvl?5:k==='seed'?50:Math.max(1,v*3),step=Number.isInteger(v)?1:0.05;slider(NAMES[k]??k,tuned[k]??v,lvl?1:0,max,step,x=>tuned[k]=x)}}
async function pick(item){cur=item;[mod,refMod]=await Promise.all([import(P+item.file),import(P+item.ref)]);
 const s=saved[item.key];tuned=s?{...mod.meta.options,...s.tuned}:{...mod.meta.options,...item.tune};extra=s?{...s.extra}:{scale:1,timeScale:1,light:1,hue:0};
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===item.key));controls();build()}
for(const it of LIST){const b=document.createElement('button');b.textContent=it.name;b.dataset.k=it.key;b.onclick=()=>pick(it);$('#tabs').append(b)}
$('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停'};
$('#replay').onclick=build;
$('#reset').onclick=()=>{delete saved[cur.key];persist();delete saved[cur.key];try{localStorage.setItem(SAVE,JSON.stringify(saved))}catch{};pick(cur)};
$('#copy').onclick=async e=>{try{await navigator.clipboard.writeText($('#out').textContent);e.target.textContent='已复制'}catch{e.target.textContent='复制失败，手动选中下方文本'}setTimeout(()=>e.target.textContent='复制参数',1500)};
function paint(fx,canvas,scale){const [w,h]=fx.meta.size,ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
 const f=fx._f&&fx._f.w===w?fx._f:(fx._f=createFrame(w,h));clearFrame(f);fx.draw(f);
 const img=new ImageData(w,h);composite(f,img.data,null);const buf=fx._buf||(fx._buf=document.createElement('canvas'));buf.width=w;buf.height=h;buf.getContext('2d').putImageData(img,0,0);
 ctx.clearRect(0,0,canvas.width,canvas.height);const bg=$('#bg').value;
 if(bg==='dark'){ctx.fillStyle='#111321';ctx.fillRect(0,0,canvas.width,canvas.height)}
 if(bg==='scene'&&ground.naturalWidth){ctx.drawImage(ground,0,1100,853,Math.round(853*canvas.height/canvas.width),0,0,canvas.width,canvas.height);ctx.fillStyle='rgba(10,15,30,.3)';ctx.fillRect(0,0,canvas.width,canvas.height)}
 const dw=w*scale,dh=h*scale;ctx.drawImage(buf,(canvas.width-dw)/2,(canvas.height-dh)/2,dw,dh)}
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;
 if(mod&&fxA){if(!paused){fxA.update(dt);fxB.update(dt*extra.timeScale);fxL.forEach(f=>f.update(dt*extra.timeScale));
   if(!refMod.meta.loop&&fxA.t>(refMod.meta.duration??1)+.3)fxA=mk(refMod);if(!mod.meta.loop&&fxB.t>(mod.meta.duration??1)+.3)fxB=mk(mod,opts());if(!mod.meta.loop&&fxL[0]&&fxL[0].t>(mod.meta.duration??1)+.3)fxL=fxL.map((f,i)=>mk(mod,{...opts(),level:i+1}))}
  if(levels)fxL.forEach((f,i)=>paint(f,$('#lv'+(i+1)),1));else{paint(fxA,$('#a'),Math.max(1,extra.scale));paint(fxB,$('#b'),extra.scale)}}
 requestAnimationFrame(tick)}
function setLevels(on){levels=on;document.body.classList.toggle('levels',on);$('#lvs').hidden=!on;$('#lvMode').classList.toggle('on',on);$('#lvMode').textContent=on?'返回单个对照':'1–5 级同屏'}
$('#lvMode').onclick=()=>{setLevels(!levels);build()};
const Q=new URLSearchParams(location.search),start=LIST.find(i=>i.key===Q.get('fx'))??LIST[0];
if(Q.get('embed')==='1'){document.body.classList.add('embed');$('#bg').value='scene';$('#full').href='fx-lab.html?fx='+start.key}
if(Q.get('levels')==='1')setLevels(true);
pick(start);requestAnimationFrame(tick);
</script></body></html>
