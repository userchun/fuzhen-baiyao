<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>符镇百妖 · 素材中心</title><link rel="stylesheet" href="style.css"></head>
<body><aside class="sidebar"><a class="brand" href="./"><span class="seal">符</span><span>符镇百妖<small>素材中心</small></span></a><div class="nav-title">素材库</div><nav id="categories" aria-label="素材分类"></nav><div class="side-note"><i></i> 本地项目素材<br><span>序列动画按游戏帧率播放<br>新增素材后更新索引即可</span><a href="http://127.0.0.1:7456/" target="_blank" rel="noopener">打开游戏预览 ↗</a></div></aside>
<div class="workspace"><header><div><p class="breadcrumb">符镇百妖 / 美术工作台</p><h1>让每一帧，都看得清。</h1><p class="intro">浏览原图、检查透明边缘，播放角色动作与结界特效。</p></div><div class="summary" id="summary"></div></header>
<div class="toolbar"><label class="search"><span>⌕</span><input type="search" id="search" placeholder="搜索名称、文件名…" aria-label="搜索素材"></label><label class="animated-only"><input id="animatedOnly" type="checkbox">仅看动效</label><button id="reload">刷新索引 ↻</button></div>
<div class="content"><section class="library"><div class="section-title"><h2 id="sectionTitle">全部素材</h2><span id="resultCount"></span></div><div id="grid" class="grid"></div><p id="empty" hidden>没有找到匹配的素材。</p></section>
<section class="inspector" aria-label="素材详情"><div class="inspector-heading"><div><span id="detailCategory" class="eyebrow"></span><h2 id="detailName">选择一个素材</h2></div><span id="kindLabel" class="tag"></span></div><div id="stage" class="stage checker"><canvas id="preview" width="720" height="620" aria-label="所选素材预览"></canvas><iframe id="effect" title="结界交互预览" hidden></iframe><span id="missing" hidden>素材尚未制作</span></div>
<div class="view-controls"><label>底色 <select id="background"><option value="checker">透明棋盘</option><option value="dark">深色</option><option value="light">浅色</option><option value="scene">战场</option></select></label><label>缩放 <select id="zoom"><option value="fit">适应窗口</option><option value="1">1× 原尺寸</option><option value="2">2×</option><option value="4">4×</option></select></label><label><input id="pixel" type="checkbox" checked>像素锐利</label></div>
<div class="playback"><div class="play-row"><select id="clip" aria-label="动作"></select><button id="play">暂停</button><button id="step" aria-label="下一帧">下一帧 ›</button><select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><input id="timeline" type="range" min="0" max="0" value="0" aria-label="动画帧"><div class="frame-info"><span id="frameInfo"></span><span id="playHint"></span></div></div>
<div class="metadata"><p id="status"></p><dl><dt>尺寸</dt><dd id="dimensions"></dd><dt>透明通道</dt><dd id="alpha"></dd><dt>文件</dt><dd><code id="path"></code></dd></dl><div class="file-actions"><a id="original" target="_blank" rel="noopener">查看原图 ↗</a><a id="download" download>下载素材 ↓</a><button id="copyPath">复制路径</button></div><p id="notice" role="status"></p></div></section></div><footer>原始素材直接读取项目文件 · 不修改游戏存档或运行资源</footer></div><script type="module" src="app.js"></script></body></html>
